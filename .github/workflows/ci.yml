name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: 22

      - name: Enable pnpm (Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test:unit

      - name: neozip-wiki (all tests, browser bundle check, example)
        run: |
          pnpm --filter neozip-wiki run test
          pnpm --filter neozip-wiki run check:browser-bundle
          pnpm --filter neozip-wiki run example

      - name: neozip-prune (typecheck, lint, all tests)
        run: |
          pnpm --filter neozip-prune run typecheck
          pnpm --filter neozip-prune run lint
          pnpm --filter neozip-prune run test
